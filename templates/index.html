<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="index, nofollow">
  <meta name="author" content="Yupeng">
  <meta name="description" content="Private Camera">

  <!-- * for Open Graph -->
  <meta property="og:title" content="Private Camera">
  <meta property="og:description" content="Private Camera">

  <link rel="icon" href="/static/img/favicon.png" type="image/png">
  <title>Private Camera</title>
  <style>
    :root {
      --bg-color: #fff;
      --border-color: #dcdfe6;

    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg-color: #121212;
        --border-color: #4c4d4f;
      }
    }
    body {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      background-color: var(--bg-color);
      width: 100%;
      height: 100%;
    }

    #motion-camera {
      display: block;
      width: auto;
      height: auto;
      max-width: calc(100% - 16px);
      border-radius: 12px;
      margin: 12px auto 0;
      border-radius: 12px;
      border-color: var(--border-color);
    }
  </style>
</head>
<body>
    <img
      id="motion-camera"
      src="/motion/camera"
      alt="Camera"
    />
</body>
</html>
